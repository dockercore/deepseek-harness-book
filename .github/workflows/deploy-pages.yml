name: verify-site

on:
  push:
    branches:
      - main
    paths:
      - "book/**"
      - "site/**"
      - "README.md"
      - "scripts/prepare_book.py"
      - "scripts/prepare_site.py"
      - "mkdocs.yml"
      - "requirements-site.txt"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: verify-site
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install site dependencies
        run: python -m pip install -r requirements-site.txt

      - name: Prepare Markdown for the web
        run: python scripts/prepare_site.py

      - name: Build site
        run: mkdocs build --strict
